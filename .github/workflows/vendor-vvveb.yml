name: Vendor VvvebJs para editor visual

on:
  push:
    branches:
      - feat/admin-visual-builder
    paths:
      - .github/workflows/vendor-vvveb.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch de trabalho
        uses: actions/checkout@v4
        with:
          ref: feat/admin-visual-builder
          fetch-depth: 0

      - name: Obter VvvebJs fixado
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vvvebjs
          git clone --quiet https://github.com/givanz/VvvebJs.git /tmp/vvvebjs
          git -C /tmp/vvvebjs checkout --quiet 1acbab7ebfe3e7b004f1f18c039d26550fc04bd8

      - name: Copiar runtime local
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p admin/editor
          rm -rf admin/editor/css admin/editor/js admin/editor/libs admin/editor/fonts admin/editor/img
          cp -R /tmp/vvvebjs/css admin/editor/css
          cp -R /tmp/vvvebjs/js admin/editor/js
          cp -R /tmp/vvvebjs/libs admin/editor/libs
          cp -R /tmp/vvvebjs/fonts admin/editor/fonts
          cp -R /tmp/vvvebjs/img admin/editor/img
          cp /tmp/vvvebjs/editor.html admin/editor/index.html
          cp /tmp/vvvebjs/LICENSE admin/editor/VVVEBJS-LICENSE

      - name: Adaptar editor para Escola Iêda
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("admin/editor/index.html")
          text = path.read_text(encoding="utf-8")

          text = text.replace('<html lang="en" data-bs-theme="auto">', '<html lang="pt-BR" data-bs-theme="light">')
          text = text.replace('<title>VvvebJs</title>', '<title>Editor visual | Escola Iêda MCPM</title>')
          text = text.replace('<link rel="icon" href="favicon.ico">', '<link rel="icon" href="../../imagens/favicon.png">')
          text = text.replace('<link href="css/editor.css" rel="stylesheet">', '<link href="css/editor.css" rel="stylesheet">\n  <link href="escola-editor.css" rel="stylesheet">')
          text = text.replace('src="img/logo.png"', 'src="../../logo_escola.webp"')
          text = text.replace('href="/" class="img"', 'href="../" class="img"')
          text = text.replace('href="/admin" class="img"', 'href="../" class="img"')

          removals = [
              '<link href="libs/media/media.css" rel="stylesheet">',
              '<script src="libs/media/media.js"></script>',
              '<script src="libs/builder/plugin-media.js"></script>',
              '<script src="libs/builder/plugin-google-fonts.js"></script>',
              '<script src="demo/landing/sections/sections.js"></script>',
              '<script src="libs/builder/sections-bootstrap4.js"></script>',
              '<script src="libs/builder/blocks-bootstrap4.js"></script>',
              '<script src="demo/landing/styles/styles.js"></script>',
              '<script src="libs/builder/plugin-ai-assistant.js"></script>',
          ]
          for item in removals:
              text = text.replace(item, '')

          text = text.replace("window.mediaPath = '../../media';", "window.mediaPath = '';" )
          text = text.replace("Vvveb.themeBaseUrl = 'demo/landing/';", "Vvveb.themeBaseUrl = '';" )

          marker = '<script>\n\tlet renameUrl'
          if marker not in text:
              raise SystemExit('Marcador de inicialização do VvvebJs não encontrado')
          text = text.replace(marker, '<script src="escola-componentes.js"></script>\n  <script>\n\tlet renameUrl', 1)

          pattern = re.compile(r'\tlet defaultPages = \{.*?\n\t\};\n\n\n\tlet pages = defaultPages;', re.S)
          replacement = '''\tlet defaultPages = {
\t\t"index": {
\t\t\tname: "index",
\t\t\tfilename: "index.html",
\t\t\tfile: "../../index.html",
\t\t\turl: "../../index.html",
\t\t\ttitle: "Página inicial",
\t\t\tfolder: null,
\t\t\tdescription: "Página inicial da Escola Iêda"
\t\t}
\t};

\tlet pages = defaultPages;'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Bloco defaultPages não localizado; upstream mudou')

          replacements = {
              '>Pages<': '>Páginas<',
              '>Components<': '>Elementos<',
              '>Sections<': '>Seções<',
              '>Style<': '>Aparência<',
              'title="Components"': 'title="Elementos"',
              'title="Style"': 'title="Aparência"',
              'title="Preview"': 'title="Prévia"',
              'title="Save changes (Ctrl + S)"': 'title="Salvar alterações (Ctrl + S)"',
              '<span>Save</span>': '<span>Salvar</span>',
              '<span>Saving </span>': '<span>Salvando </span>',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          if '</body>' not in text:
              raise SystemExit('Fechamento body não encontrado')
          text = text.replace('</body>', '  <script src="escola-editor.js"></script>\n</body>', 1)
          path.write_text(text, encoding="utf-8")

      - name: Registrar versão vendorizada
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'VvvebJs upstream: givanz/VvvebJs' > admin/editor/VVVEbJS-VERSION.txt
          printf '%s\n' 'Commit: 1acbab7ebfe3e7b004f1f18c039d26550fc04bd8' >> admin/editor/VVVEbJS-VERSION.txt
          printf '%s\n' 'Licença: Apache-2.0' >> admin/editor/VVVEbJS-VERSION.txt

      - name: Commitar arquivos do editor na branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/editor
          if git diff --cached --quiet; then
            echo "Editor já está sincronizado."
            exit 0
          fi
          git commit -m "chore(admin): vendorizar VvvebJs fixado"
          git push origin HEAD:feat/admin-visual-builder

# Este comentário força um evento de push via Contents API para iniciar a vendorização.
