name: Portal V2 - CMS

on:
  push:
    branches:
      - v2/cms-integration
    paths:
      - "portal-v2/**"
      - ".github/workflows/portal-v2-cms-ci.yml"
  pull_request:
    paths:
      - "portal-v2/**"
      - ".github/workflows/portal-v2-cms-ci.yml"

permissions:
  contents: write

jobs:
  validar-cms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TINA_PUBLIC_CLIENT_ID: ${{ secrets.TINA_PUBLIC_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
    defaults:
      run:
        working-directory: portal-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Auditar conteúdo TinaCMS
        run: npm run cms:audit
      - name: Verificar Astro e TypeScript
        run: npm run check
      - name: Compilar painel TinaCMS
        if: env.TINA_PUBLIC_CLIENT_ID != '' && env.TINA_TOKEN != ''
        run: npm run cms:build
      - name: Compilar site
        run: npm run build

  publicar-v2-cms:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2/cms-integration'
    needs: validar-cms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TINA_PUBLIC_CLIENT_ID: ${{ secrets.TINA_PUBLIC_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
    steps:
      - name: Baixar V2 CMS
        uses: actions/checkout@v4
        with:
          ref: v2/cms-integration
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compilar painel e site
        working-directory: source/portal-v2
        run: |
          npm install --no-audit --no-fund
          npm run cms:build
          npm run build

      - name: Baixar site oficial
        uses: actions/checkout@v4
        with:
          ref: main
          path: published
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar somente /v2
        run: |
          rm -rf published/v2
          mkdir -p published/v2
          cp -R source/portal-v2/dist/. published/v2/

      - name: Publicar V2 com painel
        working-directory: published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2
          if git diff --cached --quiet; then
            echo "Sem alterações para publicar."
            exit 0
          fi
          git commit -m "chore(v2): publicar preview com CMS"
          git push origin main

  preparar-locks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2/cms-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/cms-integration
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        working-directory: portal-v2
        run: npm install --no-audit --no-fund
      - name: Gerar arquivos TinaCMS
        working-directory: portal-v2
        run: npx tinacms build --local --noTelemetry
      - name: Salvar arquivos de controle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal-v2/package-lock.json portal-v2/tina/tina-lock.json
          if git diff --cached --quiet; then
            echo "Arquivos de controle já estão atualizados."
            exit 0
          fi
          git commit -m "chore(cms): atualizar locks [skip ci]"
          git push origin v2/cms-integration
