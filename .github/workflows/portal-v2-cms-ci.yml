name: Portal V2 - CMS

on:
  push:
    branches:
      - v2/cms-integration
    paths:
      - "portal-v2/**"
      - ".github/workflows/portal-v2-cms-ci.yml"
  pull_request:
    paths:
      - "portal-v2/**"
      - ".github/workflows/portal-v2-cms-ci.yml"

permissions:
  contents: write

jobs:
  validar-cms:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: portal-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Auditar conteúdo TinaCMS
        run: npm run cms:audit
      - name: Verificar Astro e TypeScript
        run: npm run check
      - name: Compilar site
        run: npm run build

  preparar-locks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2/cms-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/cms-integration
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        working-directory: portal-v2
        run: npm install --no-audit --no-fund
      - name: Gerar arquivos TinaCMS
        working-directory: portal-v2
        run: npx tinacms build --local --noTelemetry
      - name: Salvar arquivos de controle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal-v2/package-lock.json portal-v2/tina/tina-lock.json
          if git diff --cached --quiet; then
            echo "Arquivos de controle já estão atualizados."
            exit 0
          fi
          git commit -m "chore(cms): atualizar locks [skip ci]"
          git push origin v2/cms-integration
