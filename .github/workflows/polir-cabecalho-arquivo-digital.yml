name: Polir cabecalho Arquivo Digital

on:
  push:
    branches:
      - agent/cabecalho-estavel-arquivo-digital
    paths:
      - .github/workflows/polir-cabecalho-arquivo-digital.yml

permissions:
  contents: write

jobs:
  polir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/cabecalho-estavel-arquivo-digital
          fetch-depth: 0

      - name: Limpar espacamento e ordenar teste final
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('arquivo-digital/arquivo-digital.css')
          css = css_path.read_text(encoding='utf-8')
          css = re.sub(r'\n(?:[ \t]*\n){2,}', '\n\n', css)
          css_path.write_text(css.rstrip() + '\n', encoding='utf-8')

          testes_path = Path('scripts/testes-regressao-arquivo-digital.mjs')
          testes = testes_path.read_text(encoding='utf-8')
          marcador = '// CABECALHO_ESTAVEL_AUTH_20260812_TESTE'
          log_final = 'console.log("Testes de regressao do Arquivo Digital concluidos com sucesso.");'
          if testes.count(marcador) != 1 or testes.count(log_final) != 1:
              raise SystemExit('Estrutura esperada do teste final nao encontrada.')
          inicio = testes.index(marcador)
          bloco = testes[inicio:].strip()
          prefixo = testes[:inicio].rstrip()
          if not prefixo.endswith(log_final):
              raise SystemExit('Mensagem final nao esta imediatamente antes do teste novo.')
          prefixo = prefixo[:-len(log_final)].rstrip()
          testes = prefixo + '\n\n' + bloco + '\n\n' + log_final + '\n'
          testes_path.write_text(testes, encoding='utf-8')
          PY

      - name: Validar tudo novamente
        run: |
          node --check arquivo-digital/arquivo-digital.js
          node scripts/testes-regressao-arquivo-digital.mjs
          node scripts/testes-utils-arquivo-digital.mjs
          node scripts/testes-graph-client-arquivo-digital.mjs
          node scripts/validar-arquivo-digital.mjs
          node scripts/auditoria-visual-estatica-v3-12.mjs
          git diff --check

      - name: Garantir escopo do acabamento
        run: |
          test "$(git diff --name-only HEAD | sort)" = "$(printf '%s\n' arquivo-digital/arquivo-digital.css scripts/testes-regressao-arquivo-digital.mjs | sort)"
          grep -q 'INICIO_CABECALHO_ESTAVEL_AUTH_20260812' arquivo-digital/arquivo-digital.css
          grep -q 'CABECALHO_ESTAVEL_AUTH_20260812_TESTE' scripts/testes-regressao-arquivo-digital.mjs

      - name: Remover workflow temporario
        run: rm -f .github/workflows/polir-cabecalho-arquivo-digital.yml

      - name: Publicar acabamento validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polir estrutura do cabeçalho"
          git push origin HEAD:agent/cabecalho-estavel-arquivo-digital
