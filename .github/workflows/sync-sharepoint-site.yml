name: Sincronizar CMS SharePoint

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sharepoint-cms]
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-sharepoint-site.yml"
      - "scripts/sync-sharepoint-site.py"

permissions:
  id-token: write
  contents: write

concurrency:
  group: sharepoint-cms-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Entrar no Microsoft Entra por OIDC
        uses: azure/login@v2
        with:
          client-id: bc2ecead-5f2e-48b8-9d48-9d01f2848cfa
          tenant-id: f04e0fa3-b8dc-4f77-be3c-7dfda0635188
          allow-no-subscriptions: true

      - name: Obter token Microsoft Graph
        shell: bash
        run: |
          token="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          echo "GRAPH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Sincronizar SharePoint com o site público
        run: python3 scripts/sync-sharepoint-site.py

      - name: Publicar alterações na main
        shell: bash
        run: |
          if git diff --quiet -- site-data/publicacoes-publicas.json imagens/publicacoes; then
            echo "Nenhuma alteração pública encontrada."
            exit 0
          fi

          git config user.name "Escola Ieda CMS"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site-data/publicacoes-publicas.json imagens/publicacoes
          git commit -m "site: sincronizar CMS SharePoint"
          git push origin HEAD:main
