name: Migrar historico para carga sob demanda

on:
  push:
    branches:
      - agent/historico-sob-demanda
    paths:
      - scripts/patch-historico-sob-demanda.py
      - .github/workflows/patch-historico-sob-demanda.yml

permissions:
  contents: write

jobs:
  migrar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/historico-sob-demanda
          fetch-depth: 0

      - name: Ajustar patch ao formato atual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch-historico-sob-demanda.py')
          s = p.read_text(encoding='utf-8')
          antigo = '''def sub_once(texto, padrao, novo, rotulo):
              resultado, total = re.subn(padrao, lambda _m: novo, texto, count=1, flags=re.S)'''.replace('              ', '    ')
          novo = '''def sub_once(texto, padrao, novo, rotulo):
              if rotulo == "abertura do histórico geral sob demanda":
                  padrao = r"    window\\.abrirHistoricoGeral\\s*=\\s*function\\s*\\(\\s*\\)\\s*\\{.*?\\n\\s*\\};\\s*\\n\\s*window\\.verMaisHistoricoGeral"
              if rotulo == "botão de paginação do histórico":
                  padrao = r"\\s*window\\.verMaisHistoricoGeral\\s*=\\s*function\\s*\\(\\s*event\\s*\\)\\s*\\{.*?\\n\\s*\\};"
              resultado, total = re.subn(padrao, lambda _m: novo, texto, count=1, flags=re.S)'''.replace('              ', '    ')
          if antigo not in s:
              raise SystemExit('Helper sub_once esperado não encontrado.')
          p.write_text(s.replace(antigo, novo, 1), encoding='utf-8')
          PY

      - name: Aplicar migracao
        run: python3 scripts/patch-historico-sob-demanda.py

      - name: Validar sintaxe principal
        run: node --check arquivo-digital/arquivo-digital.js

      - name: Rodar testes de regressao
        run: node scripts/testes-regressao-arquivo-digital.mjs

      - name: Rodar testes de utilitarios
        run: node scripts/testes-utils-arquivo-digital.mjs

      - name: Rodar validador oficial
        run: node scripts/validar-arquivo-digital.mjs

      - name: Conferir remocao da politica antiga
        run: |
          test ! -e scripts/retencao-historico-arquivo-digital-v1.ps1
          test ! -e scripts/consultar-historico-frio-arquivo-digital-v1.ps1
          test ! -e scripts/USO-RETENCAO-HISTORICO-ARQUIVO-DIGITAL-V1.md
          ! grep -RniE 'retencao-historico-arquivo-digital|consultar-historico-frio-arquivo-digital|USO-RETENCAO-HISTORICO-ARQUIVO-DIGITAL' README.md AGENTS.md arquivo-digital scripts/validar-arquivo-digital.mjs scripts/testes-regressao-arquivo-digital.mjs

      - name: Remover ferramenta temporaria
        run: rm -f scripts/patch-historico-sob-demanda.py .github/workflows/patch-historico-sob-demanda.yml

      - name: Publicar resultado na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Substituir retenção por histórico sob demanda"
          git push origin HEAD:agent/historico-sob-demanda
