name: Portal V2 - Astro

on:
  push:
    branches:
      - v2/home-visual
    paths:
      - "portal-v2/**"
      - ".github/workflows/portal-v2-ci.yml"
  pull_request:
    paths:
      - "portal-v2/**"
      - ".github/workflows/portal-v2-ci.yml"

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar Astro e TypeScript
        run: npm run check
      - name: Compilar site
        run: npm run build

  publicar-v2:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2/home-visual'
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar V2
        uses: actions/checkout@v4
        with:
          ref: v2/home-visual
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compilar V2
        working-directory: source/portal-v2
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Baixar site oficial
        uses: actions/checkout@v4
        with:
          ref: main
          path: published
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar somente /v2
        run: |
          rm -rf published/v2
          mkdir -p published/v2
          cp -R source/portal-v2/dist/. published/v2/

      - name: Publicar teste no dominio oficial
        working-directory: published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2
          if git diff --cached --quiet; then
            echo "Sem alteracoes para publicar."
            exit 0
          fi
          git commit -m "chore(v2): atualizar preview publico"
          git push origin main
