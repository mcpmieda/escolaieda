name: Portal V2 - Astro

on:
  push:
    branches:
      - v2/home-visual
    paths:
      - "portal-v2/**"
      - ".github/workflows/portal-v2-ci.yml"
  pull_request:
    paths:
      - "portal-v2/**"
      - ".github/workflows/portal-v2-ci.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar Astro e TypeScript
        run: npm run check
      - name: Compilar site
        run: npm run build
