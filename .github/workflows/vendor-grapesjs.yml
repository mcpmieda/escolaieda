name: Vendor GrapesJS do editor visual

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  vendor:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/admin-visual-builder'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a branch do editor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Incorporar GrapesJS fixado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p admin/editor/vendor
          curl --fail --location --silent --show-error \
            https://cdnjs.cloudflare.com/ajax/libs/grapesjs/0.22.13/grapes.min.js \
            --output admin/editor/vendor/grapes.min.js
          curl --fail --location --silent --show-error \
            https://cdnjs.cloudflare.com/ajax/libs/grapesjs/0.22.13/css/grapes.min.css \
            --output admin/editor/vendor/grapes.min.css
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/GrapesJS/grapesjs/v0.22.13/LICENSE \
            --output admin/editor/vendor/GRAPESJS-LICENSE

      - name: Validar arquivos vendorizados
        shell: bash
        run: |
          set -euo pipefail
          test -s admin/editor/vendor/grapes.min.js
          test -s admin/editor/vendor/grapes.min.css
          test -s admin/editor/vendor/GRAPESJS-LICENSE
          test "$(wc -c < admin/editor/vendor/grapes.min.js)" -gt 1000000
          test "$(wc -c < admin/editor/vendor/grapes.min.css)" -gt 50000
          grep -q "GrapesJS" admin/editor/vendor/grapes.min.js
          printf '%s\n' \
            'GrapesJS 0.22.13' \
            'Origem do pacote: https://cdnjs.com/libraries/grapesjs/0.22.13' \
            'Projeto: https://github.com/GrapesJS/grapesjs' \
            'Licença: BSD-3-Clause' \
            > admin/editor/vendor/VERSION.txt

      - name: Versionar runtime local na própria branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            admin/editor/vendor/grapes.min.js \
            admin/editor/vendor/grapes.min.css \
            admin/editor/vendor/GRAPESJS-LICENSE \
            admin/editor/vendor/VERSION.txt
          if git diff --cached --quiet; then
            echo "Runtime GrapesJS já está incorporado."
            exit 0
          fi
          git commit -m "chore(admin): incorporar GrapesJS 0.22.13"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
