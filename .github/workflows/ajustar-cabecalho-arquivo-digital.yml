name: Ajustar cabecalho Arquivo Digital

on:
  push:
    branches:
      - agent/cabecalho-estavel-arquivo-digital
    paths:
      - .github/workflows/ajustar-cabecalho-arquivo-digital.yml

permissions:
  contents: write

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/cabecalho-estavel-arquivo-digital
          fetch-depth: 0

      - name: Consolidar cabecalho e estados de autenticacao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('arquivo-digital/arquivo-digital.css')
          html_path = Path('arquivo-digital/index.html')
          js_path = Path('arquivo-digital/arquivo-digital.js')
          testes_path = Path('scripts/testes-regressao-arquivo-digital.mjs')
          agents_path = Path('AGENTS.md')

          css = css_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')
          testes = testes_path.read_text(encoding='utf-8')
          agents = agents_path.read_text(encoding='utf-8')

          if 'INICIO_CABECALHO_ESTAVEL_AUTH_20260812' in css:
              raise SystemExit('Cabecalho oficial ja existe; abortando para evitar regra duplicada.')

          tokens_cabecalho = (
              '.cabecalhoSistema',
              '.cabecalhoMarca',
              '.logoSistema',
              '.cabecalhoAcoes',
              '.btnCabecalhoAcao',
              '.btnCabecalhoEntrar',
              '.btnCabecalhoSair',
              '.subtituloSistema',
          )

          def separar_seletores(preludio):
              partes = []
              inicio = 0
              profundidade = 0
              aspas = None
              i = 0
              while i < len(preludio):
                  c = preludio[i]
                  if aspas:
                      if c == '\\':
                          i += 2
                          continue
                      if c == aspas:
                          aspas = None
                  else:
                      if c in ('"', "'"):
                          aspas = c
                      elif c == '(':
                          profundidade += 1
                      elif c == ')':
                          profundidade = max(0, profundidade - 1)
                      elif c == ',' and profundidade == 0:
                          partes.append(preludio[inicio:i].strip())
                          inicio = i + 1
                  i += 1
              partes.append(preludio[inicio:].strip())
              return [parte for parte in partes if parte]

          def seletor_cabecalho(seletor):
              seletor = seletor.strip()
              if any(token in seletor for token in tokens_cabecalho):
                  return True
              if 'estadoPreLogin' not in seletor:
                  for identificador in ('btnEntrar', 'btnSair', 'btnAbrirConfiguracoesTopo'):
                      if re.search(rf'(^|[\\s>+~])#{identificador}(?=[:.\\[\\s>+~#]|$)', seletor):
                          return True
              return False

          def fechar_chave(texto, abertura):
              profundidade = 1
              i = abertura + 1
              aspas = None
              while i < len(texto):
                  if not aspas and texto.startswith('/*', i):
                      fim = texto.find('*/', i + 2)
                      if fim < 0:
                          raise SystemExit('Comentario CSS sem fechamento.')
                      i = fim + 2
                      continue
                  c = texto[i]
                  if aspas:
                      if c == '\\':
                          i += 2
                          continue
                      if c == aspas:
                          aspas = None
                  else:
                      if c in ('"', "'"):
                          aspas = c
                      elif c == '{':
                          profundidade += 1
                      elif c == '}':
                          profundidade -= 1
                          if profundidade == 0:
                              return i
                  i += 1
              raise SystemExit('Bloco CSS sem fechamento.')

          def proximo_delimitador(texto, inicio):
              i = inicio
              aspas = None
              parenteses = 0
              while i < len(texto):
                  if not aspas and texto.startswith('/*', i):
                      fim = texto.find('*/', i + 2)
                      if fim < 0:
                          return len(texto), None
                      i = fim + 2
                      continue
                  c = texto[i]
                  if aspas:
                      if c == '\\':
                          i += 2
                          continue
                      if c == aspas:
                          aspas = None
                  else:
                      if c in ('"', "'"):
                          aspas = c
                      elif c == '(':
                          parenteses += 1
                      elif c == ')':
                          parenteses = max(0, parenteses - 1)
                      elif parenteses == 0 and c in ('{', ';'):
                          return i, c
                  i += 1
              return len(texto), None

          def limpar_regras_cabecalho(texto):
              saida = []
              pos = 0
              while pos < len(texto):
                  indice, tipo = proximo_delimitador(texto, pos)
                  if tipo is None:
                      saida.append(texto[pos:])
                      break
                  if tipo == ';':
                      saida.append(texto[pos:indice + 1])
                      pos = indice + 1
                      continue

                  trecho_pre = texto[pos:indice]
                  fechamento = fechar_chave(texto, indice)
                  corpo = texto[indice + 1:fechamento]

                  match_inicio = re.match(r'((?:\\s|/\\*.*?\\*/)*)', trecho_pre, flags=re.S)
                  prefixo = match_inicio.group(1)
                  preludio = trecho_pre[len(prefixo):].strip()

                  if preludio.startswith('@'):
                      nome_at = preludio.split(None, 1)[0].lower()
                      if nome_at in ('@media', '@supports', '@layer', '@container', '@document'):
                          corpo_limpo = limpar_regras_cabecalho(corpo)
                          if corpo_limpo == corpo:
                              saida.append(trecho_pre + '{' + corpo + '}')
                          elif re.sub(r'/\\*.*?\\*/', '', corpo_limpo, flags=re.S).strip():
                              saida.append(trecho_pre + '{' + corpo_limpo + '}')
                          else:
                              saida.append(prefixo)
                      else:
                          saida.append(trecho_pre + '{' + corpo + '}')
                  else:
                      seletores = separar_seletores(preludio)
                      removidos = [s for s in seletores if seletor_cabecalho(s)]
                      if not removidos:
                          saida.append(trecho_pre + '{' + corpo + '}')
                      else:
                          mantidos = [s for s in seletores if not seletor_cabecalho(s)]
                          if mantidos:
                              indentacao = re.search(r'(^|\\n)([ \\t]*)[^\\n]*$', prefixo)
                              separador = ',\\n' + (indentacao.group(2) if indentacao else '')
                              saida.append(prefixo + separador.join(mantidos) + ' {' + corpo + '}')
                          else:
                              saida.append(prefixo)
                  pos = fechamento + 1
              return ''.join(saida)

          css_limpo = limpar_regras_cabecalho(css)
          if css_limpo == css:
              raise SystemExit('Nenhuma regra antiga de cabecalho foi encontrada para consolidar.')

          bloco_cabecalho = r'''
    /* INICIO_CABECALHO_ESTAVEL_AUTH_20260812 */
    .cabecalhoSistema {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      align-items: center;
      gap: 18px;
      min-height: 92px;
      margin: -18px -18px 14px;
      padding: 18px 20px;
      box-sizing: border-box;
      border-radius: 24px;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(15, 47, 102, .98) 0%, rgba(29, 78, 216, .88) 54%, rgba(14, 116, 144, .78) 100%),
        url("assets/imagens/arquivo-digital-capa.jpg") center/cover;
      color: #ffffff;
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .20);
    }

    .cabecalhoSistema::after {
      content: "";
      position: absolute;
      right: -80px;
      bottom: -120px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .10);
      pointer-events: none;
    }

    .cabecalhoMarca {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      min-height: 62px;
    }

    .cabecalhoMarca > div {
      min-width: 0;
    }

    .logoSistema {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      object-fit: contain;
      box-sizing: border-box;
      padding: 6px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 10px 26px rgba(15, 23, 42, .20);
    }

    .cabecalhoSistema h1 {
      margin: 0 0 2px;
      color: #ffffff;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.08;
      letter-spacing: -.03em;
    }

    .cabecalhoSistema .subtituloSistema {
      max-width: 640px;
      margin: 0;
      color: rgba(219, 234, 254, .96);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: .01em;
    }

    .cabecalhoAcoes {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      grid-template-rows: 18px 36px;
      align-items: center;
      justify-items: end;
      column-gap: 7px;
      row-gap: 5px;
      min-width: 0;
      min-height: 59px;
    }

    .cabecalhoAcoes #status {
      grid-column: 1 / -1;
      grid-row: 1;
      width: 100%;
      min-width: 0;
      min-height: 18px;
      margin: 0;
      overflow: hidden;
      color: rgba(239, 246, 255, .92);
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cabecalhoAcoes button {
      margin: 0;
    }

    .btnCabecalhoAcao,
    #btnAbrirConfiguracoesTopo.btnCabecalhoAcao,
    #btnSair.btnCabecalhoSair {
      grid-row: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 42px;
      max-width: 180px;
      min-height: 36px;
      margin: 0;
      padding: 8px 12px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, .34);
      border-radius: 10px;
      background: rgba(255, 255, 255, .14);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
      backdrop-filter: blur(12px);
      transition: background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }

    .btnCabecalhoAcao[hidden],
    #btnAbrirConfiguracoesTopo.btnCabecalhoAcao[hidden],
    #btnSair.btnCabecalhoSair[hidden] {
      display: none !important;
    }

    #btnEntrar.btnCabecalhoAcao {
      grid-column: 2 / 4;
    }

    #btnAbrirConfiguracoesTopo.btnCabecalhoAcao {
      grid-column: 2;
    }

    #btnSair.btnCabecalhoSair {
      grid-column: 3;
    }

    .btnCabecalhoAcao .iconeBotao,
    #btnAbrirConfiguracoesTopo.btnCabecalhoAcao .iconeBotao,
    #btnSair.btnCabecalhoSair .iconeBotao {
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      filter: brightness(0) invert(1);
    }

    .btnCabecalhoAcao:hover:not(:disabled),
    #btnAbrirConfiguracoesTopo.btnCabecalhoAcao:hover:not(:disabled),
    #btnSair.btnCabecalhoSair:hover:not(:disabled) {
      background: rgba(255, 255, 255, .24);
      color: #ffffff;
      border-color: rgba(255, 255, 255, .52);
      box-shadow: 0 10px 24px rgba(15, 23, 42, .18);
      transform: translateY(-1px);
    }

    .btnCabecalhoAcao:focus-visible,
    #btnAbrirConfiguracoesTopo.btnCabecalhoAcao:focus-visible,
    #btnSair.btnCabecalhoSair:focus-visible {
      outline: 3px solid rgba(255, 255, 255, .72);
      outline-offset: 2px;
    }

    @media (max-width: 760px) {
      .cabecalhoSistema {
        grid-template-columns: 1fr;
        align-items: stretch;
        gap: 10px;
        min-height: 0;
        margin: -12px -12px 10px;
        padding: 14px;
        border-radius: 19px 19px 20px 20px;
      }

      .cabecalhoMarca {
        min-height: 54px;
      }

      .cabecalhoAcoes {
        grid-template-columns: minmax(0, 1fr) auto auto;
        grid-template-rows: 30px 40px;
        width: 100%;
        min-height: 75px;
        align-items: center;
      }

      .cabecalhoAcoes #status {
        min-height: 30px;
        line-height: 15px;
        text-align: left;
        white-space: normal;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .btnCabecalhoAcao,
      #btnAbrirConfiguracoesTopo.btnCabecalhoAcao,
      #btnSair.btnCabecalhoSair {
        min-height: 40px;
      }
    }

    @media (max-width: 420px) {
      .cabecalhoMarca {
        gap: 10px;
      }

      .logoSistema {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
        padding: 4px;
        border-radius: 14px;
      }

      .cabecalhoSistema h1 {
        font-size: 24px;
      }

      .cabecalhoSistema .subtituloSistema {
        font-size: 12px;
      }

      .cabecalhoAcoes {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: 30px 42px;
        column-gap: 6px;
        min-height: 77px;
      }

      #btnEntrar.btnCabecalhoAcao {
        grid-column: 1 / -1;
        width: 100%;
        max-width: none;
      }

      #btnAbrirConfiguracoesTopo.btnCabecalhoAcao {
        grid-column: 1;
        width: 100%;
        max-width: none;
      }

      #btnSair.btnCabecalhoSair {
        grid-column: 2;
        width: 100%;
        max-width: none;
      }

      .btnCabecalhoAcao span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
    /* FIM_CABECALHO_ESTAVEL_AUTH_20260812 */
'''

          marcador_dashboard = '\n    .dashboardTopo {'
          if css_limpo.count(marcador_dashboard) != 1:
              raise SystemExit(f'Marcador de insercao do cabecalho inesperado: {css_limpo.count(marcador_dashboard)} ocorrencias.')
          css_limpo = css_limpo.replace(marcador_dashboard, '\n' + bloco_cabecalho.rstrip() + '\n\n    .dashboardTopo {', 1)

          # HTML: o estado inicial fica sem estilos inline concorrendo com o CSS.
          def trocar_display_inline_por_hidden(texto, botao_id):
              padrao = rf'(<button\\s+id="{botao_id}"[^>]*?)\\s+style="display:none"([^>]*>)'
              novo, total = re.subn(padrao, rf'\\1 hidden\\2', texto, count=1)
              if total != 1:
                  raise SystemExit(f'Botao {botao_id}: style inicial esperado nao encontrado exatamente uma vez.')
              return novo

          html = trocar_display_inline_por_hidden(html, 'btnAbrirConfiguracoesTopo')
          html = trocar_display_inline_por_hidden(html, 'btnSair')

          # JS: visibilidade e layout deixam de disputar via style.display.
          helper = '''    function definirVisibilidadeBotaoCabecalho(id, visivel) {
      const botao = document.getElementById(id);
      if (botao) botao.hidden = !visivel;
    }

'''
          marcador_helper = '    function aplicarBlindagemVisualPreLogin() {'
          if js.count(marcador_helper) != 1:
              raise SystemExit('Funcao aplicarBlindagemVisualPreLogin nao encontrada exatamente uma vez.')
          js = js.replace(marcador_helper, helper + marcador_helper, 1)

          substituicoes_regex = [
              (r'document\\.getElementById\\("btnAbrirConfiguracoesTopo"\\)\\?\\.style\\.setProperty\\("display",\\s*"none"\\);', 'definirVisibilidadeBotaoCabecalho("btnAbrirConfiguracoesTopo", false);'),
              (r'document\\.getElementById\\("btnSair"\\)\\?\\.style\\.setProperty\\("display",\\s*"none"\\);', 'definirVisibilidadeBotaoCabecalho("btnSair", false);'),
              (r'document\\.getElementById\\("btnAbrirConfiguracoesTopo"\\)\\.style\\.display\\s*=\\s*"none";', 'definirVisibilidadeBotaoCabecalho("btnAbrirConfiguracoesTopo", false);'),
          ]
          for padrao, novo in substituicoes_regex:
              js = re.sub(padrao, novo, js)

          bloco_estado_antigo = '''      document.getElementById("btnEntrar").style.display = usuario ? "none" : "inline-block";
      document.getElementById("btnSair").style.display = usuario ? "inline-block" : "none";
      document.getElementById("btnAbrirConfiguracoesTopo").style.display = "none";'''
          bloco_estado_novo = '''      definirVisibilidadeBotaoCabecalho("btnEntrar", !usuario);
      definirVisibilidadeBotaoCabecalho("btnSair", false);
      definirVisibilidadeBotaoCabecalho("btnAbrirConfiguracoesTopo", false);'''
          if js.count(bloco_estado_antigo) != 1:
              raise SystemExit('Bloco inicial de visibilidade do cabecalho nao encontrado exatamente uma vez.')
          js = js.replace(bloco_estado_antigo, bloco_estado_novo, 1)

          linha_liberar_antiga = '          document.getElementById("btnAbrirConfiguracoesTopo").style.display = "inline-block";'
          linha_liberar_nova = '''          definirVisibilidadeBotaoCabecalho("btnAbrirConfiguracoesTopo", true);
          definirVisibilidadeBotaoCabecalho("btnSair", true);'''
          if js.count(linha_liberar_antiga) != 1:
              raise SystemExit('Liberacao do botao de configuracoes nao encontrada exatamente uma vez.')
          js = js.replace(linha_liberar_antiga, linha_liberar_nova, 1)

          if re.search(r'getElementById\\("(?:btnEntrar|btnSair|btnAbrirConfiguracoesTopo)"\\).*?style\\.(?:display|setProperty)', js):
              raise SystemExit('Ainda existe controle inline de display nos botoes do cabecalho.')

          # Teste de regressao permanente para impedir retorno de camadas antigas.
          teste_marcador = 'CABECALHO_ESTAVEL_AUTH_20260812_TESTE'
          if teste_marcador in testes:
              raise SystemExit('Teste de cabecalho ja existe; abortando duplicacao.')
          teste_novo = r'''

// CABECALHO_ESTAVEL_AUTH_20260812_TESTE
testar("Cabecalho permanece estavel durante autenticacao e sem camadas CSS antigas", () => {
  const inicioMarcador = "/* INICIO_CABECALHO_ESTAVEL_AUTH_20260812 */";
  const fimMarcador = "/* FIM_CABECALHO_ESTAVEL_AUTH_20260812 */";
  const inicio = css.indexOf(inicioMarcador);
  const fim = css.indexOf(fimMarcador);
  assert.ok(inicio >= 0 && fim > inicio, "Bloco oficial do cabecalho deve existir uma unica vez.");
  assert.equal(css.indexOf(inicioMarcador, inicio + 1), -1, "Nao pode existir segundo bloco oficial do cabecalho.");

  const bloco = css.slice(inicio, fim + fimMarcador.length);
  const foraDoBloco = (css.slice(0, inicio) + css.slice(fim + fimMarcador.length))
    .replace(/\/\*[\s\S]*?\*\//g, "");

  assert.doesNotMatch(
    foraDoBloco,
    /\.(?:cabecalhoSistema|cabecalhoMarca|logoSistema|cabecalhoAcoes|btnCabecalhoAcao|btnCabecalhoEntrar|btnCabecalhoSair|subtituloSistema)\b/,
    "Seletores dedicados ao cabecalho devem existir somente no bloco oficial."
  );
  assert.match(bloco, /grid-template-columns:\s*minmax\(0,\s*1fr\)\s+360px/, "Desktop deve reservar largura estavel para as acoes.");
  assert.match(bloco, /min-height:\s*92px/, "Cabecalho desktop deve reservar altura estavel durante autenticacao.");
  assert.match(bloco, /\.cabecalhoAcoes\s*\{[\s\S]*?grid-template-rows:\s*18px 36px/, "Area de autenticacao deve reservar linhas fixas no desktop.");
  assert.doesNotMatch(bloco, /modoCompacto/, "Preferencia de modo compacto nao deve mover o cabecalho apos o JavaScript iniciar.");

  const entrar = elementoPorId("btnEntrar");
  const configuracoes = elementoPorId("btnAbrirConfiguracoesTopo");
  const sair = elementoPorId("btnSair");
  assert.doesNotMatch(entrar, /\shidden(?:\s|>)/i, "Entrar deve continuar disponivel no pre-login.");
  assert.match(configuracoes, /\shidden(?:\s|>)/i, "Configuracoes deve iniciar oculto sem style inline.");
  assert.match(sair, /\shidden(?:\s|>)/i, "Sair deve iniciar oculto sem style inline.");
  assert.doesNotMatch(configuracoes + sair, /\sstyle=/i, "Botoes do cabecalho nao devem disputar display com estilo inline.");

  const atualizar = blocoFuncao("atualizarTela");
  const blindar = blocoFuncao("aplicarBlindagemVisualPreLogin");
  assert.match(js, /function definirVisibilidadeBotaoCabecalho\(/, "Visibilidade do cabecalho deve ter helper unico.");
  assert.match(atualizar, /definirVisibilidadeBotaoCabecalho\("btnEntrar", !usuario\)/, "Estado inicial deve usar o helper do cabecalho.");
  assert.match(atualizar, /definirVisibilidadeBotaoCabecalho\("btnSair", true\)/, "Sair so deve ser liberado apos acesso confirmado.");
  assert.doesNotMatch(atualizar + blindar, /style\.(?:display|setProperty)/, "Autenticacao nao deve controlar geometria do cabecalho com style inline.");
});
'''
          testes = testes.rstrip() + teste_novo + '\n'

          regra_agents = 'Cabeçalho do Arquivo Digital deve manter a mesma geometria durante pré-login, verificação de acesso e sessão autenticada; não reintroduzir regras de cabeçalho espalhadas ou `style.display` nos botões de autenticação.'
          if regra_agents not in agents:
              marcador_agents = 'Manter interface clara para usuário leigo.\n'
              if agents.count(marcador_agents) != 1:
                  raise SystemExit('Marcador de UI no AGENTS.md nao encontrado exatamente uma vez.')
              agents = agents.replace(marcador_agents, marcador_agents + regra_agents + '\n', 1)

          css_path.write_text(css_limpo, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          js_path.write_text(js, encoding='utf-8')
          testes_path.write_text(testes, encoding='utf-8')
          agents_path.write_text(agents, encoding='utf-8')
          PY

      - name: Validar sintaxe JavaScript
        run: node --check arquivo-digital/arquivo-digital.js

      - name: Rodar testes de regressao
        run: node scripts/testes-regressao-arquivo-digital.mjs

      - name: Rodar testes de utilitarios
        run: node scripts/testes-utils-arquivo-digital.mjs

      - name: Rodar testes Graph client
        run: node scripts/testes-graph-client-arquivo-digital.mjs

      - name: Rodar validador oficial
        run: node scripts/validar-arquivo-digital.mjs

      - name: Rodar auditoria visual estatica
        run: node scripts/auditoria-visual-estatica-v3-12.mjs

      - name: Auditar limpeza do cabecalho
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          css = Path('arquivo-digital/arquivo-digital.css').read_text(encoding='utf-8')
          js = Path('arquivo-digital/arquivo-digital.js').read_text(encoding='utf-8')
          html = Path('arquivo-digital/index.html').read_text(encoding='utf-8')
          ini = css.index('/* INICIO_CABECALHO_ESTAVEL_AUTH_20260812 */')
          fim_m = '/* FIM_CABECALHO_ESTAVEL_AUTH_20260812 */'
          fim = css.index(fim_m, ini) + len(fim_m)
          fora = re.sub(r'/\*.*?\*/', '', css[:ini] + css[fim:], flags=re.S)
          legado = re.findall(r'\.(?:cabecalhoSistema|cabecalhoMarca|logoSistema|cabecalhoAcoes|btnCabecalhoAcao|btnCabecalhoEntrar|btnCabecalhoSair|subtituloSistema)\b', fora)
          if legado:
              raise SystemExit(f'Regras antigas de cabecalho restantes: {sorted(set(legado))}')
          if re.search(r'getElementById\("(?:btnEntrar|btnSair|btnAbrirConfiguracoesTopo)"\).*?style\.(?:display|setProperty)', js):
              raise SystemExit('Controle inline antigo ainda existe no JS.')
          if 'id="btnAbrirConfiguracoesTopo"' not in html or 'id="btnSair"' not in html:
              raise SystemExit('Botoes essenciais do cabecalho desapareceram.')
          print('Cabecalho consolidado sem regras dedicadas fora do bloco oficial.')
          PY
          git diff --check

      - name: Remover workflow temporario
        run: rm -f .github/workflows/ajustar-cabecalho-arquivo-digital.yml

      - name: Publicar alteracoes validadas na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arquivo-digital/arquivo-digital.css arquivo-digital/index.html arquivo-digital/arquivo-digital.js scripts/testes-regressao-arquivo-digital.mjs AGENTS.md .github/workflows/ajustar-cabecalho-arquivo-digital.yml
          git commit -m "Estabilizar cabeçalho do Arquivo Digital"
          git push origin HEAD:agent/cabecalho-estavel-arquivo-digital
