name: Ajustar cabecalho Arquivo Digital

on:
  push:
    branches:
      - agent/cabecalho-estavel-arquivo-digital
    paths:
      - .github/workflows/ajustar-cabecalho-arquivo-digital.yml

permissions:
  contents: write

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/cabecalho-estavel-arquivo-digital
          fetch-depth: 0

      - name: Ajustar patch temporario
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/tmp-ajustar-cabecalho-arquivo-digital.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "if css_limpo.count(marcador_dashboard) != 1:\n    raise SystemExit(f'Marcador de insercao do cabecalho inesperado: {css_limpo.count(marcador_dashboard)} ocorrencias.')",
              "if marcador_dashboard not in css_limpo:\n    raise SystemExit('Marcador de insercao do cabecalho nao encontrado.')",
              1,
          )

          antigo_seletor = '''def seletor_cabecalho(seletor):
    seletor = seletor.strip()
    if any(token in seletor for token in tokens_cabecalho):
        return True'''
          novo_seletor = '''def seletor_cabecalho(seletor):
    seletor = seletor.strip()
    seletor_alvo = re.sub(r':not\\([^()]*\\)', '', seletor)
    if any(token in seletor_alvo for token in tokens_cabecalho):
        return True'''
          if antigo_seletor not in s:
              raise SystemExit('Classificador de seletores do cabecalho nao encontrado.')
          s = s.replace(antigo_seletor, novo_seletor, 1)

          s = s.replace(
              '      document.getElementById("btnAbrirConfiguracoesTopo").style.display = "none";',
              '      definirVisibilidadeBotaoCabecalho("btnAbrirConfiguracoesTopo", false);',
              1,
          )

          antigo_assert = '  assert.doesNotMatch(atualizar + blindar, /style\\.(?:display|setProperty)/, "Autenticacao nao deve controlar geometria do cabecalho com style inline.");'
          novo_assert = '  assert.doesNotMatch(atualizar + blindar, /getElementById\\(\\"(?:btnEntrar|btnSair|btnAbrirConfiguracoesTopo)\\"\\)[^;]*style\\.(?:display|setProperty)/, "Botoes do cabecalho nao devem controlar geometria com style inline.");'
          if antigo_assert not in s:
              raise SystemExit('Assercao ampla do teste de cabecalho nao encontrada.')
          s = s.replace(antigo_assert, novo_assert, 1)

          antigo_fora = '''  const foraDoBloco = (css.slice(0, inicio) + css.slice(fim + fimMarcador.length))
    .replace(/\\/\\*[\\s\\S]*?\\*\\//g, "");'''
          novo_fora = '''  const foraDoBloco = (css.slice(0, inicio) + css.slice(fim + fimMarcador.length))
    .replace(/\\/\\*[\\s\\S]*?\\*\\//g, "")
    .replace(/:not\\([^()]*\\)/g, "");'''
          if antigo_fora not in s:
              raise SystemExit('Normalizacao do CSS fora do bloco nao encontrada.')
          s = s.replace(antigo_fora, novo_fora, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar script temporario
        run: python3 -m py_compile scripts/tmp-ajustar-cabecalho-arquivo-digital.py

      - name: Consolidar cabecalho e estados de autenticacao
        run: python3 scripts/tmp-ajustar-cabecalho-arquivo-digital.py

      - name: Validar sintaxe JavaScript
        run: node --check arquivo-digital/arquivo-digital.js

      - name: Rodar testes de regressao
        run: node scripts/testes-regressao-arquivo-digital.mjs

      - name: Rodar testes de utilitarios
        run: node scripts/testes-utils-arquivo-digital.mjs

      - name: Rodar testes Graph client
        run: node scripts/testes-graph-client-arquivo-digital.mjs

      - name: Rodar validador oficial
        run: node scripts/validar-arquivo-digital.mjs

      - name: Rodar auditoria visual estatica
        run: node scripts/auditoria-visual-estatica-v3-12.mjs

      - name: Auditar limpeza do cabecalho
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          css = Path('arquivo-digital/arquivo-digital.css').read_text(encoding='utf-8')
          js = Path('arquivo-digital/arquivo-digital.js').read_text(encoding='utf-8')
          html = Path('arquivo-digital/index.html').read_text(encoding='utf-8')
          ini = css.index('/* INICIO_CABECALHO_ESTAVEL_AUTH_20260812 */')
          fim_m = '/* FIM_CABECALHO_ESTAVEL_AUTH_20260812 */'
          fim = css.index(fim_m, ini) + len(fim_m)
          fora = re.sub(r'/\*.*?\*/', '', css[:ini] + css[fim:], flags=re.S)
          fora = re.sub(r':not\([^()]*\)', '', fora)
          legado = re.findall(r'\.(?:cabecalhoSistema|cabecalhoMarca|logoSistema|cabecalhoAcoes|btnCabecalhoAcao|btnCabecalhoEntrar|btnCabecalhoSair|subtituloSistema)\b', fora)
          if legado:
              raise SystemExit(f'Regras antigas de cabecalho restantes: {sorted(set(legado))}')
          if re.search(r'getElementById\("(?:btnEntrar|btnSair|btnAbrirConfiguracoesTopo)"\).*?style\.(?:display|setProperty)', js):
              raise SystemExit('Controle inline antigo ainda existe no JS.')
          if 'REGRA_GLOBAL_BUTTON_HOVER_LIMITADA_20260527' not in css:
              raise SystemExit('Regra global limitada de hover foi removida indevidamente.')
          if 'id="btnAbrirConfiguracoesTopo"' not in html or 'id="btnSair"' not in html:
              raise SystemExit('Botoes essenciais do cabecalho desapareceram.')
          print('Cabecalho consolidado; regras globais de protecao preservadas.')
          PY
          git diff --check

      - name: Remover ferramentas temporarias
        run: |
          rm -f scripts/tmp-ajustar-cabecalho-arquivo-digital.py
          rm -rf scripts/__pycache__
          rm -f .github/workflows/ajustar-cabecalho-arquivo-digital.yml

      - name: Publicar alteracoes validadas na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Estabilizar cabeçalho do Arquivo Digital"
          git push origin HEAD:agent/cabecalho-estavel-arquivo-digital
