name: Ajustar cabecalho Arquivo Digital

on:
  push:
    branches:
      - agent/cabecalho-estavel-arquivo-digital
    paths:
      - .github/workflows/ajustar-cabecalho-arquivo-digital.yml

permissions:
  contents: write

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/cabecalho-estavel-arquivo-digital
          fetch-depth: 0

      - name: Ajustar marcador de insercao do patch
        run: |
          sed -i "s/if css_limpo.count(marcador_dashboard) != 1:/if marcador_dashboard not in css_limpo:/" scripts/tmp-ajustar-cabecalho-arquivo-digital.py
          sed -i "s/raise SystemExit(f'Marcador de insercao do cabecalho inesperado: {css_limpo.count(marcador_dashboard)} ocorrencias.')/raise SystemExit('Marcador de insercao do cabecalho nao encontrado.')/" scripts/tmp-ajustar-cabecalho-arquivo-digital.py

      - name: Validar script temporario
        run: python3 -m py_compile scripts/tmp-ajustar-cabecalho-arquivo-digital.py

      - name: Consolidar cabecalho e estados de autenticacao
        run: python3 scripts/tmp-ajustar-cabecalho-arquivo-digital.py

      - name: Validar sintaxe JavaScript
        run: node --check arquivo-digital/arquivo-digital.js

      - name: Rodar testes de regressao
        run: node scripts/testes-regressao-arquivo-digital.mjs

      - name: Rodar testes de utilitarios
        run: node scripts/testes-utils-arquivo-digital.mjs

      - name: Rodar testes Graph client
        run: node scripts/testes-graph-client-arquivo-digital.mjs

      - name: Rodar validador oficial
        run: node scripts/validar-arquivo-digital.mjs

      - name: Rodar auditoria visual estatica
        run: node scripts/auditoria-visual-estatica-v3-12.mjs

      - name: Auditar limpeza do cabecalho
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          css = Path('arquivo-digital/arquivo-digital.css').read_text(encoding='utf-8')
          js = Path('arquivo-digital/arquivo-digital.js').read_text(encoding='utf-8')
          html = Path('arquivo-digital/index.html').read_text(encoding='utf-8')
          ini = css.index('/* INICIO_CABECALHO_ESTAVEL_AUTH_20260812 */')
          fim_m = '/* FIM_CABECALHO_ESTAVEL_AUTH_20260812 */'
          fim = css.index(fim_m, ini) + len(fim_m)
          fora = re.sub(r'/\*.*?\*/', '', css[:ini] + css[fim:], flags=re.S)
          legado = re.findall(r'\.(?:cabecalhoSistema|cabecalhoMarca|logoSistema|cabecalhoAcoes|btnCabecalhoAcao|btnCabecalhoEntrar|btnCabecalhoSair|subtituloSistema)\b', fora)
          if legado:
              raise SystemExit(f'Regras antigas de cabecalho restantes: {sorted(set(legado))}')
          if re.search(r'getElementById\("(?:btnEntrar|btnSair|btnAbrirConfiguracoesTopo)"\).*?style\.(?:display|setProperty)', js):
              raise SystemExit('Controle inline antigo ainda existe no JS.')
          if 'id="btnAbrirConfiguracoesTopo"' not in html or 'id="btnSair"' not in html:
              raise SystemExit('Botoes essenciais do cabecalho desapareceram.')
          print('Cabecalho consolidado sem regras dedicadas fora do bloco oficial.')
          PY
          git diff --check

      - name: Remover ferramentas temporarias
        run: |
          rm -f scripts/tmp-ajustar-cabecalho-arquivo-digital.py
          rm -rf scripts/__pycache__
          rm -f .github/workflows/ajustar-cabecalho-arquivo-digital.yml

      - name: Publicar alteracoes validadas na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Estabilizar cabeçalho do Arquivo Digital"
          git push origin HEAD:agent/cabecalho-estavel-arquivo-digital
