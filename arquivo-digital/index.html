<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquivo Digital - Escola Iêda MCPM</title>

  <script type="module">
    import { PublicClientApplication } from "https://esm.sh/@azure/msal-browser@5.11.0";

    const CONFIG = {
      clientId: "bc2ecead-5f2e-48b8-9d48-9d01f2848cfa",
      tenantId: "f04e0fa3-b8dc-4f77-be3c-7dfda0635188",
      redirectUri: "https://escolaieda.com/arquivo-digital/",
      siteId: "eduieda.sharepoint.com,7ea13de9-13ae-40d5-b5f0-ad4782e3f585,d31492d1-c5c1-4710-8f6e-bd38e1fcfb17",
      documentosAtivosListId: "7adea611-e627-4593-a0b0-cecf58744c16"
    };

    let documentosCarregados = [];

    const msalConfig = {
      auth: {
        clientId: CONFIG.clientId,
        authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
        redirectUri: CONFIG.redirectUri
      },
      cache: {
        cacheLocation: "sessionStorage",
        storeAuthStateInCookie: false
      }
    };

    const msalInstance = new PublicClientApplication(msalConfig);
    await msalInstance.initialize();

    const loginRequest = {
      scopes: ["User.Read", "Sites.Read.All"]
    };

    function normalizarTexto(texto) {
      return (texto || "")
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    async function obterToken() {
      const conta = msalInstance.getAllAccounts()[0];

      if (!conta) {
        throw new Error("Usuário não conectado.");
      }

      try {
        const resposta = await msalInstance.acquireTokenSilent({
          ...loginRequest,
          account: conta
        });

        return resposta.accessToken;
      } catch (erro) {
        await msalInstance.acquireTokenRedirect(loginRequest);
      }
    }

    function renderizarDocumentos(listaArquivos) {
      const lista = document.getElementById("listaDocumentos");
      const contador = document.getElementById("contadorResultados");

      contador.textContent = `${listaArquivos.length} resultado(s) encontrado(s)`;

      if (!listaArquivos.length) {
        lista.innerHTML = "<li>Nenhum documento encontrado.</li>";
        return;
      }

      lista.innerHTML = "";

      listaArquivos.forEach(item => {
        const nome = item.nome;
        const link = item.link;

        const li = document.createElement("li");
        li.innerHTML = `
          <strong>${nome}</strong><br>
          <a href="${link}" target="_blank" rel="noopener">Abrir PDF</a>
        `;
        lista.appendChild(li);
      });
    }

    function filtrarDocumentos() {
      const termo = normalizarTexto(document.getElementById("campoBusca").value);

      if (!termo) {
        renderizarDocumentos(documentosCarregados);
        return;
      }

      const filtrados = documentosCarregados.filter(doc =>
        normalizarTexto(doc.nome).includes(termo)
      );

      renderizarDocumentos(filtrados);
    }

    async function listarDocumentos() {
      const lista = document.getElementById("listaDocumentos");
      lista.innerHTML = "<li>Carregando documentos...</li>";

      try {
        const token = await obterToken();

        const url = `https://graph.microsoft.com/v1.0/sites/${CONFIG.siteId}/lists/${CONFIG.documentosAtivosListId}/items?$expand=fields($select=FileLeafRef,FileRef,UniqueId)&$top=50`;

        const resposta = await fetch(url, {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        if (!resposta.ok) {
          const textoErro = await resposta.text();
          throw new Error(textoErro);
        }

        const dados = await resposta.json();
        const arquivos = (dados.value || []).filter(item => item.fields && item.fields.FileLeafRef);

        documentosCarregados = arquivos.map(item => {
          const nome = item.fields.FileLeafRef;
          const caminho = item.fields.FileRef;

          return {
            nome,
            caminho,
            id: item.fields.UniqueId,
            link: "https://eduieda.sharepoint.com" + caminho
          };
        });

        renderizarDocumentos(documentosCarregados);

      } catch (erro) {
        lista.innerHTML = `<li class="erro">Erro ao carregar documentos: ${erro.message}</li>`;
        console.error(erro);
      }
    }

    async function atualizarTela() {
      const contas = msalInstance.getAllAccounts();
      const usuario = contas[0];

      document.getElementById("status").textContent = usuario
        ? "Usuário conectado"
        : "Usuário não conectado";

      document.getElementById("btnEntrar").style.display = usuario ? "none" : "inline-block";
      document.getElementById("btnSair").style.display = usuario ? "inline-block" : "none";
      document.getElementById("areaSistema").style.display = usuario ? "block" : "none";

      if (usuario) {
        document.getElementById("usuario").innerHTML = `
          <strong>Nome:</strong> ${usuario.name || ""}<br>
          <strong>Conta:</strong> ${usuario.username || ""}
        `;

        await listarDocumentos();
      } else {
        document.getElementById("usuario").innerHTML = "";
      }
    }

    window.entrar = async function () {
      await msalInstance.loginRedirect(loginRequest);
    };

    window.sair = async function () {
      const conta = msalInstance.getAllAccounts()[0];
      await msalInstance.logoutRedirect({ account: conta });
    };

    window.filtrarDocumentos = filtrarDocumentos;

    await msalInstance.handleRedirectPromise();
    await atualizarTela();
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      margin: 0;
      padding: 40px;
      color: #1f2937;
    }

    .card {
      max-width: 950px;
      margin: auto;
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      color: #0f2f66;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      background: #0f2f66;
      color: white;
      margin-right: 8px;
    }

    #btnSair {
      background: #666;
      display: none;
    }

    .info {
      margin-top: 20px;
      padding: 15px;
      background: #eef3ff;
      border-radius: 12px;
    }

    #areaSistema {
      margin-top: 25px;
      display: none;
    }

    .busca {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      margin: 10px 0 8px 0;
    }

    .contador {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 15px;
    }

    ul {
      padding-left: 0;
      list-style: none;
    }

    li {
      margin-bottom: 14px;
      padding: 14px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    a {
      color: #0f2f66;
      font-weight: bold;
    }

    .erro {
      color: #b00020;
      background: #fff0f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Arquivo Digital</h1>
    <p>Área inicial de teste do sistema de documentos escolares.</p>

    <p id="status">Verificando login...</p>

    <button id="btnEntrar" onclick="entrar()">Entrar com Microsoft</button>
    <button id="btnSair" onclick="sair()">Sair</button>

    <div id="usuario" class="info"></div>

    <div id="areaSistema">
      <h2>Documentos ativos</h2>

      <input
        id="campoBusca"
        class="busca"
        type="text"
        placeholder="Digite o nome do aluno ou parte do nome..."
        oninput="filtrarDocumentos()"
      >

      <div id="contadorResultados" class="contador">Carregando...</div>

      <ul id="listaDocumentos">
        <li>Aguardando carregamento...</li>
      </ul>
    </div>
  </div>
</body>
</html>
