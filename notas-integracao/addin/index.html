<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Add-in de Sincronização de Notas</title>
  <link rel="stylesheet" href="../css/integracao.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <main class="addin-shell">
    <section class="card addin-card">
      <p class="eyebrow">POC Office.js</p>
      <h1>Sincronização de notas</h1>
      <p>Monitora somente <strong>TB_LANCAMENTOS</strong>. O painel precisa permanecer aberto durante a prova.</p>
      <div class="addin-status" id="addinStatus" role="status">Aguardando o Excel.</div>
      <div class="addin-actions">
        <button class="button" id="connectButton" type="button" disabled>Conectar e monitorar</button>
        <button class="button secondary" id="retryButton" type="button" disabled>Tentar fila novamente</button>
        <button class="button secondary" id="disconnectButton" type="button" disabled>Pausar monitoramento</button>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
